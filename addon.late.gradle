import com.gtnewhorizons.retrofuturagradle.minecraft.RunMinecraftTask
import org.gradle.api.GradleException
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// 使用 GTNHGradle 2.0.25 公开扩展/API 将 alpha、beta、rc 版本映射为预发布。
def releaseTypeForVersion = { String version ->
    version ==~ /(?i)^.+-(beta|alpha|rc)([-.]?[0-9A-Za-z].*)?$/ ? "beta" : "release"
}

def modVersionProvider = providers.provider { project.ext.modVersion.toString() }

// 按已创建的 modrinth 扩展配置版本类型，扩展由启用的 projectId 提供。
def modrinth = extensions.findByName("modrinth")
if (modrinth != null) {
    modrinth.versionType.set(modVersionProvider.map { version -> releaseTypeForVersion(version) })
}

// 原版宿主运行类路径门禁由gradle/verification.gradle.kts补充检查。
tasks.register("verifyRunClasspathIsolation") { group = "verification" }
tasks.named("check").configure { dependsOn("verifyRunClasspathIsolation") }

// TaskPublishCurseForge.getUploadArtifacts、UploadArtifact.releaseType 与
// UploadArtifact.getAdditionalArtifacts 是 CurseForgeGradle 1.1.28 的公开 API。
tasks.matching { task -> task.name == "publishCurseforge" }.configureEach { publishTask ->
    publishTask.uploadArtifacts.each { artifact ->
        artifact.releaseType = modVersionProvider.map { version -> releaseTypeForVersion(version) }
        artifact.additionalArtifacts.each { additionalArtifact ->
            additionalArtifact.releaseType = modVersionProvider.map {
                version -> releaseTypeForVersion(version)
            }
        }
    }
}
