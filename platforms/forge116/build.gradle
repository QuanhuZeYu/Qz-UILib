plugins {
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'java'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
minecraft { mappings channel: 'snapshot', version: '20210309-1.16.5' }
dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.42' }
version = findProperty('uilibVersion') ?: '5.0.0-beta1'
group = findProperty('uilibGroup') ?: (version.toString().startsWith('4.') ? 'club.heiqi.uilib' : 'asia.quanhuzeyu.uilib')

repositories {
    maven { url = uri('.gradle/maven') }
    mavenCentral()
}

ext.uilibJavaTarget = 8
ext.uilibBinding = 'lwjgl3'
apply from: '../../gradle/loader-dependencies.gradle'
sourceSets {
    main {
        java.srcDirs = ['../../src/minecraft116/java', '../../src/minecraftResource/java']
        resources.srcDirs = ['../../src/minecraft116/resources']
    }
    manual {
        java.srcDirs = ['../../src/minecraft116Manual/java']
        resources.srcDirs = ['../../src/minecraft116Manual/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + uilibManual
        runtimeClasspath += output + compileClasspath
    }
}
tasks.withType(ProcessResources).configureEach {
    // mods.toml 的版本与依赖范围由构建期属性展开，不保留手写版本。
    inputs.property 'uilibVersion', project.version.toString()
    filesMatching('META-INF/mods.toml') { expand(uilibVersion: project.version.toString()) }
}
apply from: '../../gradle/host-font-resources.gradle'
dependencies { compileOnly uilibProduction }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
jar {
    archiveBaseName = 'qz_uilib_forge116'
    from('../../LICENSE')
    manifest { attributes('Implementation-Version': project.version) }
    finalizedBy 'reobfJar'
}
task manualJar(type: Jar) {
    archiveBaseName = 'qz_uilib_manual_forge116'
    from sourceSets.manual.output
    // 核心验证服务、资源与通知只随人工包交付；各包 MIT 保留来源目录。
    from({ zipTree(uilibArtifacts.verification.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        filesMatching('LICENSE') { path = 'META-INF/licenses/core-verification/LICENSE' }
    }
    from('../../LICENSE')
    from({ zipTree(uilibArtifacts.gallery.singleFile) }) {
        exclude 'META-INF/MANIFEST.MF'
        filesMatching('LICENSE') { path = 'META-INF/licenses/core-gallery/LICENSE' }
    }
    finalizedBy 'reobfManualJar'
}
reobf { manualJar {} }
tasks.named('check') {
    dependsOn 'jar', 'reobfJar'
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar', Jar).get().archiveFile.get().asFile).withCloseable { zip ->
            verifyHostFontResources(zip)
            if (zip.entries().toList().any { it.name.startsWith('club/heiqi/uilib/testing/') || it.name.startsWith('club/heiqi/uilib/internal/devtools/') })
                throw new GradleException('正式宿主不能包含测试代码')
        }
    }
}

// Forge 36 从 FMLModType 装载独立库；消费 Maven 正式产物，不把核心装进宿主 Mod。
task glAdapterJar(type: Jar) {
    archiveFileName = 'qz_uilib-gl-adapter-java8.jar'
    from('../../LICENSE')
    destinationDirectory = layout.buildDirectory.dir('libraries')
    from({ zipTree(uilibArtifacts['gl-renderer'].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    // Platform 适配模块携带同一份第三方通知，合并后只保留一份。
    from({ zipTree(uilibArtifacts['lwjgl3'].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE', 'META-INF/THIRD-PARTY-NOTICES.md' }
    manifest { attributes('FMLModType': 'LIBRARY') }
}
def libraryJars = ['core', 'font-adapter', 'media-adapter'].collect { name ->
    tasks.register('library' + name.split('-').collect { it.capitalize() }.join(''), Jar) {
        archiveFileName = 'qz_uilib-' + name + '-java8.jar'
        destinationDirectory = layout.buildDirectory.dir('libraries')
        from('../../LICENSE')
        from({ zipTree(uilibArtifacts[name].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
        manifest { attributes('FMLModType': 'LIBRARY') }
    }
}
task installBundle(type: Sync) {
    dependsOn jar, manualJar, glAdapterJar, 'reobfJar', 'reobfManualJar', libraryJars
    into layout.buildDirectory.dir('install')
    from jar.archiveFile
    from manualJar.archiveFile
    from glAdapterJar.archiveFile
    libraryJars.each { from(it.flatMap { library -> library.archiveFile }) }
}

// 正式发行：安装 ZIP 为宿主 + FML LIBRARY 核心/字体 + GL 适配；源包与人工包独立。
task sourcesJar(type: Jar) {
    archiveBaseName = 'qz_uilib_forge116'
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    from('../../LICENSE')
}
ext.uilibReleaseHost = 'forge116'
ext.uilibReleaseRequirements = [
        'Minecraft 1.16.5 + Forge 36.2.42',
        '正式包不携带 gallery/manual 测试代码；人工验收另附人工测试附加包与媒体适配包'
]
ext.uilibReleaseInstallAssets = [
        [from: tasks.named('jar'), name: "qz_uilib_forge116-${project.version}.jar", role: 'Forge 1.16 正式宿主'],
        [from: libraryJars[0], name: 'qz_uilib-core-java8.jar', role: 'Java8 正式核心库（FMLModType LIBRARY）'],
        [from: libraryJars[1], name: 'qz_uilib-font-adapter-java8.jar', role: 'Java8 正式字体适配库（FMLModType LIBRARY）'],
        [from: glAdapterJar, name: 'qz_uilib-gl-adapter-java8.jar', role: 'Java8 正式 GL 适配库（LWJGL3，FMLModType LIBRARY）']
]
ext.uilibReleaseTopLevelAssets = [
        [from: tasks.named('jar'), name: "qz_uilib_forge116-${project.version}.jar", role: '正式 Mod'],
        [from: tasks.named('sourcesJar'), name: "qz_uilib_forge116-${project.version}-sources.jar", role: '正式源码包'],
        [from: tasks.named('manualJar'), name: "qz_uilib_manual_forge116-${project.version}.jar", role: '人工测试附加包（可选）'],
        [from: libraryJars[2], name: "qz_uilib-media-forge116-${project.version}.jar", role: '媒体适配可选包']
]
ext.uilibReleaseExtraDependencies = ['reobfJar', 'reobfManualJar']
apply from: '../../gradle/release-assets.gradle'
