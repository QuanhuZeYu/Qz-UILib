plugins {
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'java'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(8)
minecraft { mappings channel: 'snapshot', version: '20210309-1.16.5' }
dependencies { minecraft 'net.minecraftforge:forge:1.16.5-36.2.42' }
group = 'club.heiqi.uilib'
version = findProperty('uilibVersion') ?: '4.11.1'

repositories {
    maven { url = uri('.gradle/maven') }
    mavenCentral()
}

ext.uilibJavaTarget = 8
ext.uilibBinding = 'lwjgl3'
apply from: '../../gradle/loader-dependencies.gradle'
sourceSets {
    main {
        java.srcDirs = ['../../src/minecraft116/java', '../../src/minecraftResource/java']
        resources.srcDirs = ['../../src/minecraft116/resources']
    }
    manual {
        java.srcDirs = ['../../src/minecraft116Manual/java']
        resources.srcDirs = ['../../src/minecraft116Manual/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + uilibManual
        runtimeClasspath += output + compileClasspath
    }
}
apply from: '../../gradle/host-font-resources.gradle'
dependencies { compileOnly uilibProduction }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
jar {
    archiveBaseName = 'qz_uilib_forge116'
    from('../../LICENSE')
    manifest { attributes('Implementation-Version': project.version) }
    finalizedBy 'reobfJar'
}
task manualJar(type: Jar) {
    archiveBaseName = 'qz_uilib_manual_forge116'
    from sourceSets.manual.output
    // 核心验证服务及其资源只随人工测试包交付。
    from({ zipTree(uilibArtifacts.verification.singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    from('../../LICENSE')
    from({ zipTree(uilibArtifacts.gallery.singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    finalizedBy 'reobfManualJar'
}
reobf { manualJar {} }
tasks.named('check') {
    dependsOn 'jar', 'reobfJar'
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar', Jar).get().archiveFile.get().asFile).withCloseable { zip ->
            verifyHostFontResources(zip)
        }
    }
}

// Forge 36 从 FMLModType 装载独立库；消费 Maven 正式产物，不把核心装进宿主 Mod。
task glAdapterJar(type: Jar) {
    archiveFileName = 'qz_uilib-gl-adapter-java8.jar'
    from('../../LICENSE')
    destinationDirectory = layout.buildDirectory.dir('libraries')
    from({ zipTree(uilibArtifacts['gl-renderer'].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    from({ zipTree(uilibArtifacts['lwjgl3'].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    manifest { attributes('FMLModType': 'LIBRARY') }
}
def libraryJars = ['core', 'font-adapter', 'media-adapter'].collect { name ->
    tasks.register('library' + name.split('-').collect { it.capitalize() }.join(''), Jar) {
        archiveFileName = 'qz_uilib-' + name + '-java8.jar'
        destinationDirectory = layout.buildDirectory.dir('libraries')
        from({ zipTree(uilibArtifacts[name].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
        manifest { attributes('FMLModType': 'LIBRARY') }
    }
}
task installBundle(type: Sync) {
    dependsOn jar, manualJar, glAdapterJar, 'reobfJar', 'reobfManualJar', libraryJars
    into layout.buildDirectory.dir('install')
    from jar.archiveFile
    from manualJar.archiveFile
    from glAdapterJar.archiveFile
    libraryJars.each { from(it.flatMap { library -> library.archiveFile }) }
}
