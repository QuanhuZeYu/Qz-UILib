plugins { id 'base' }
apply plugin: 'java-base'
// 当前模式只使用显式提供的 Prism 运行输入；标准 ForgeGradle 工程不参与这次配置。
repositories {
    maven { url = uri('.gradle/maven'); metadataSources { artifact() } }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}
version = findProperty('uilibVersion') ?: '5.0.0-beta1'
group = findProperty('uilibGroup') ?: (version.toString().startsWith('4.') ? 'club.heiqi.uilib' : 'asia.quanhuzeyu.uilib')
ext.uilibJavaTarget = 8
ext.uilibBinding = 'lwjgl3'
apply from: '../../gradle/loader-dependencies.gradle'
configurations { prismMappings }
dependencies { prismMappings 'de.oceanlabs.mcp:mcp_snapshot:20210309-1.16.5@zip' }

def configurePrismBuild = { task, includeManual ->
    task.group = 'build'
    task.description = includeManual ? '显式装配 UILib 宿主、人工广场与媒体运行依赖' : '使用 Prism 输入编译和生产重映射 UILib 正式宿主'
    task.dependsOn includeManual ? 'resolveUilibManual' : 'resolveUilibProduction'
    task.doFirst {
        if (!project.hasProperty('prismRoot')) throw new GradleException('缺少 -PprismRoot=<Prism Launcher 目录>')
        def jdk = project.findProperty('java8Home') ? file(project.property('java8Home')) :
                javaToolchains.launcherFor { languageVersion = org.gradle.jvm.toolchain.JavaLanguageVersion.of(8) }.get().metadata.installationPath.asFile

        def mappings = project.findProperty('mcpMappings') ? file(project.property('mcpMappings')) : configurations.prismMappings.singleFile
        task.commandLine project.findProperty('pythonExecutable') ?: 'python', file('../forge112/build-client-cache.py'),
                '--target', '116', '--launcher', file(project.property('prismRoot')),
                '--jdk', jdk, '--snapshot', mappings,
                '--repository', file('../..'), '--project', projectDir,
                '--shared', layout.buildDirectory.dir(includeManual ? 'resolved-uilib-manual' : 'resolved-uilib').get().asFile,
                '--version', project.findProperty('uilibVersion') ?: '5.0.0-beta1'
        if (includeManual) task.args '--install-bundle'
        task.environment 'PYTHONUTF8', '1'
    }
}
tasks.register('clientCacheBuild', Exec) { task -> configurePrismBuild(task, false) }
tasks.named('assemble') { dependsOn 'clientCacheBuild' }
tasks.register('installBundle', Exec) { task ->
    dependsOn 'clientCacheBuild'
    configurePrismBuild(task, true)
}
// 缓存构建器的明确安装输出；旧版本可留在同目录，清单不枚举历史产物。
ext.uilibInstallHost = 'forge116'
ext.uilibInstallAssets = [
        [name: "qz_uilib_forge116-${project.version}.jar"],
        [name: "qz_uilib_manual_forge116-${project.version}.jar"]
] + ['core', 'font-adapter', 'gl-adapter', 'media-adapter'].collect { [name: 'qz_uilib-' + it + '-java8.jar'] }
ext.uilibInstallDependencies = ['core', 'font-adapter', 'media-adapter', 'gl-renderer', 'lwjgl3', 'gallery', 'verification'].collect { uilibArtifacts[it] }
apply from: '../../gradle/install-manifest.gradle'

