buildscript {
    repositories {
        maven { url = uri('.gradle/maven') }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
sourceCompatibility = targetCompatibility = '1.8'
minecraft { mappings channel: 'snapshot', version: '20171003-1.12' }
dependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864' }
group = 'club.heiqi.uilib'
version = findProperty('uilibVersion') ?: '4.11.1'

repositories {
    maven { url = uri('.gradle/maven') }
    mavenCentral()
}

ext.uilibJavaTarget = 8
ext.uilibBinding = 'lwjgl2'
apply from: '../../gradle/loader-dependencies.gradle'
sourceSets {
    main {
        java.srcDirs = ['../../src/minecraft112/java', '../../src/minecraftShared/java']
        resources.srcDirs = ['../../src/minecraft112/resources']
    }
    manual {
        java.srcDirs = ['../../src/minecraft112Manual/java']
        resources.srcDirs = ['../../src/minecraft112Manual/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + uilibManual
        runtimeClasspath += output + compileClasspath
    }
}
dependencies { compileOnly uilibProduction }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
jar {
    archiveBaseName = 'qz_uilib_forge112'
    from('../../LICENSE')
    manifest { attributes('Implementation-Version': project.version, 'FMLCorePlugin': 'club.heiqi.uilib.host.forge112.loading.UILibLoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true') }
    finalizedBy 'reobfJar'
}
task manualJar(type: Jar) {
    archiveBaseName = 'qz_uilib_manual_forge112'
    from sourceSets.manual.output
    // 核心验证服务及其资源只随人工测试包交付。
    from({ zipTree(uilibArtifacts.verification.singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    from('../../LICENSE')
    from({ zipTree(uilibArtifacts.gallery.singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    finalizedBy 'reobfManualJar'
}
reobf { manualJar {} }

// 独立目录保留Maven 解析的库；宿主与人工入口不重复打入核心。
task glAdapterJar(type: Jar) {
    archiveFileName = 'qz_uilib-gl-adapter-java8.jar'
    from('../../LICENSE')
    destinationDirectory = layout.buildDirectory.dir('libraries')
    from({ zipTree(uilibArtifacts['gl-renderer'].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    from({ zipTree(uilibArtifacts['lwjgl2'].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
}
task installBundle(type: Sync) {
    dependsOn jar, manualJar, glAdapterJar, 'reobfJar', 'reobfManualJar'
    into layout.buildDirectory.dir('install')
    from jar.archiveFile
    from manualJar.archiveFile
    from glAdapterJar.archiveFile
    ['core', 'font-adapter', 'media-adapter'].each { name ->
        from(uilibArtifacts[name]) { rename { 'qz_uilib-' + name + '-java8.jar' } }
    }
}
