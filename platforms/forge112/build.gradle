buildscript {
    repositories {
        maven { url = uri('.gradle/maven') }
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net' }
    }
    dependencies { classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197' }
}
apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'java'
sourceCompatibility = targetCompatibility = '1.8'
minecraft { mappings channel: 'snapshot', version: '20171003-1.12' }
dependencies { minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2864' }
version = findProperty('uilibVersion') ?: '5.0.0-beta1'
group = findProperty('uilibGroup') ?: (version.toString().startsWith('4.') ? 'club.heiqi.uilib' : 'asia.quanhuzeyu.uilib')

repositories {
    maven { url = uri('.gradle/maven') }
    mavenCentral()
}

ext.uilibJavaTarget = 8
ext.uilibBinding = 'lwjgl2'
apply from: '../../gradle/loader-dependencies.gradle'
sourceSets {
    main {
        java.srcDirs = ['../../src/minecraft112/java', '../../src/minecraftShared/java', '../../src/minecraftResource/java']
        resources.srcDirs = ['../../src/minecraft112/resources']
    }
    manual {
        java.srcDirs = ['../../src/minecraft112Manual/java']
        resources.srcDirs = ['../../src/minecraft112Manual/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + uilibManual
        runtimeClasspath += output + compileClasspath
    }
}
// 1.12 的 @Mod 注解与 mcmod.info 必须携带正式版本：注解用构建期常量，资源在 processResources 展开。
def uilibReleaseVersion = project.version.toString()
def generatedVersionDir = file("$buildDir/generated/uilib-version")
def generatedManualVersionDir = file("$buildDir/generated/uilib-manual-version")
def generateVersionSources = tasks.register('generateVersionSources') {
    inputs.property 'uilibVersion', uilibReleaseVersion
    outputs.dir generatedVersionDir
    outputs.dir generatedManualVersionDir
    doLast {
        def write = { File target, String packageName ->
            target.parentFile.mkdirs()
            target.text = 'package ' + packageName + ';\n\n' +
                    '/** 构建期生成：Mod 元数据版本必须与正式产物一致。 */\n' +
                    'public final class UILibVersion {\n' +
                    '    public static final String VALUE = "' + uilibReleaseVersion + '";\n\n' +
                    '    private UILibVersion() {}\n' +
                    '}\n'
        }
        write(new File(generatedVersionDir, 'club/heiqi/uilib/host/forge112/UILibVersion.java'), 'club.heiqi.uilib.host.forge112')
        write(new File(generatedManualVersionDir, 'club/heiqi/uilib/manual/forge112/UILibVersion.java'), 'club.heiqi.uilib.manual.forge112')
    }
}
sourceSets.main.java.srcDir generatedVersionDir
sourceSets.manual.java.srcDir generatedManualVersionDir
tasks.named('compileJava') { dependsOn generateVersionSources }
tasks.named(sourceSets.manual.compileJavaTaskName) { dependsOn generateVersionSources }
tasks.withType(ProcessResources).configureEach {
    inputs.property 'uilibVersion', uilibReleaseVersion
    filesMatching('mcmod.info') { expand version: uilibReleaseVersion }
}
apply from: '../../gradle/host-font-resources.gradle'
dependencies { compileOnly uilibProduction }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
jar {
    archiveBaseName = 'qz_uilib_forge112'
    from('../../LICENSE')
    manifest { attributes('Implementation-Version': project.version, 'FMLCorePlugin': 'club.heiqi.uilib.host.forge112.loading.UILibLoadingPlugin', 'FMLCorePluginContainsFMLMod': 'true') }
    finalizedBy 'reobfJar'
}
task manualJar(type: Jar) {
    archiveBaseName = 'qz_uilib_manual_forge112'
    from sourceSets.manual.output
    // 核心验证服务及其资源只随人工测试包交付。
    from({ zipTree(uilibArtifacts.verification.singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    from('../../LICENSE')
    from({ zipTree(uilibArtifacts.gallery.singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    finalizedBy 'reobfManualJar'
}
reobf { manualJar {} }
tasks.named('check') {
    dependsOn 'jar', 'reobfJar'
    doLast {
        new java.util.zip.ZipFile(tasks.named('jar', Jar).get().archiveFile.get().asFile).withCloseable { zip ->
            verifyHostFontResources(zip)
            if (zip.entries().toList().any { it.name.startsWith('club/heiqi/uilib/testing/') || it.name.startsWith('club/heiqi/uilib/internal/devtools/') })
                throw new GradleException('正式宿主不能包含测试代码')
        }
    }
}

// 独立目录保留Maven 解析的库；宿主与人工入口不重复打入核心。
task glAdapterJar(type: Jar) {
    archiveFileName = 'qz_uilib-gl-adapter-java8.jar'
    from('../../LICENSE')
    destinationDirectory = layout.buildDirectory.dir('libraries')
    from({ zipTree(uilibArtifacts['gl-renderer'].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE' }
    // Platform 适配模块携带同一份第三方通知，合并后只保留一份。
    from({ zipTree(uilibArtifacts['lwjgl2'].singleFile) }) { exclude 'META-INF/MANIFEST.MF', 'LICENSE', 'META-INF/THIRD-PARTY-NOTICES.md' }
}
task installBundle(type: Sync) {
    dependsOn jar, manualJar, glAdapterJar, 'reobfJar', 'reobfManualJar'
    into layout.buildDirectory.dir('install')
    from jar.archiveFile
    from manualJar.archiveFile
    from glAdapterJar.archiveFile
    ['core', 'font-adapter', 'media-adapter'].each { name ->
        from(uilibArtifacts[name]) { rename { 'qz_uilib-' + name + '-java8.jar' } }
    }
}

// 正式发行：安装 ZIP 为宿主 + Java8 Core/字体/GL；源包、人工包与媒体附件独立。
task sourcesJar(type: Jar) {
    archiveBaseName = 'qz_uilib_forge112'
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
    from('../../LICENSE')
}
ext.uilibReleaseHost = 'forge112'
ext.uilibReleaseRequirements = [
        'Minecraft 1.12.2 + Forge 14.23.5.2864',
        '正式包不携带 gallery/manual 测试代码；人工验收另附人工测试附加包与媒体适配包'
]
ext.uilibReleaseInstallAssets = [
        [from: tasks.named('jar'), name: "qz_uilib_forge112-${project.version}.jar", role: 'Forge 1.12 正式宿主'],
        [from: uilibArtifacts.core, name: 'qz_uilib-core-java8.jar', role: 'Java8 正式核心库'],
        [from: uilibArtifacts['font-adapter'], name: 'qz_uilib-font-adapter-java8.jar', role: 'Java8 正式字体适配库'],
        [from: glAdapterJar, name: 'qz_uilib-gl-adapter-java8.jar', role: 'Java8 正式 GL 适配库（LWJGL2）']
]
ext.uilibReleaseTopLevelAssets = [
        [from: tasks.named('jar'), name: "qz_uilib_forge112-${project.version}.jar", role: '正式 Mod'],
        [from: tasks.named('sourcesJar'), name: "qz_uilib_forge112-${project.version}-sources.jar", role: '正式源码包'],
        [from: tasks.named('manualJar'), name: "qz_uilib_manual_forge112-${project.version}.jar", role: '人工测试附加包（可选）'],
        [from: uilibArtifacts['media-adapter'], name: "qz_uilib-media-forge112-${project.version}.jar", role: '媒体适配可选包']
]
ext.uilibReleaseExtraDependencies = ['reobfJar', 'reobfManualJar']
apply from: '../../gradle/release-assets.gradle'
