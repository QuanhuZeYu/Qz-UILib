plugins { id 'base' }

// Prism 模式以显式实例输入配置独立编译与重映射任务。
repositories {
    maven { url = uri('.gradle/maven'); metadataSources { artifact() } }
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
}
version = findProperty('uilibVersion') ?: '5.0.0-beta1'
group = findProperty('uilibGroup') ?: (version.toString().startsWith('4.') ? 'club.heiqi.uilib' : 'asia.quanhuzeyu.uilib')
ext.uilibJavaTarget = 8
ext.uilibBinding = 'lwjgl2'
apply from: '../../gradle/loader-dependencies.gradle'
configurations { prismMappings }
dependencies { prismMappings 'de.oceanlabs.mcp:mcp_snapshot:20171003-1.12@zip' }

def configurePrismBuild = { task, includeManual ->
    task.group = 'build'
    task.description = includeManual ? '显式装配 UILib 宿主、人工广场与媒体运行依赖' : '使用 Prism 输入编译和生产重映射 UILib 正式宿主'
    task.dependsOn includeManual ? 'resolveUilibManual' : 'resolveUilibProduction'
    task.doFirst {
        if (!project.hasProperty('prismRoot')) throw new GradleException('缺少 -PprismRoot=<Prism Launcher 目录>')
        def jdk = project.findProperty('java8Home') ? file(project.property('java8Home')) : new File(System.getProperty('java.home'))
        if (!new File(jdk, 'bin/javac.exe').isFile()) jdk = jdk.parentFile
        if (!new File(jdk, 'bin/javac.exe').isFile() || !JavaVersion.current().isJava8Compatible())
            throw new GradleException('Prism 编译需要 JDK8，可通过 -Pjava8Home 指定')

        def mappings = project.findProperty('mcpMappings') ? file(project.property('mcpMappings')) : configurations.prismMappings.singleFile
        task.commandLine project.findProperty('pythonExecutable') ?: 'python', file('build-client-cache.py'),
                '--target', '112', '--launcher', file(project.property('prismRoot')),
                '--jdk', jdk, '--snapshot', mappings,
                '--repository', file('../..'), '--project', projectDir,
                '--shared', layout.buildDirectory.dir(includeManual ? 'resolved-uilib-manual' : 'resolved-uilib').get().asFile,
                '--version', project.findProperty('uilibVersion') ?: '5.0.0-beta1'
        if (includeManual) task.args '--install-bundle'
        task.environment 'PYTHONUTF8', '1'
    }
}
tasks.register('clientCacheBuild', Exec) { task -> configurePrismBuild(task, false) }
tasks.named('assemble') { dependsOn 'clientCacheBuild' }
tasks.register('installBundle', Exec) { task ->
    dependsOn 'clientCacheBuild'
    configurePrismBuild(task, true)
}
// 安装清单按本次版本声明缓存构建器的确切输出。
ext.uilibInstallHost = 'forge112'
ext.uilibInstallAssets = [
        [name: "qz_uilib_forge112-${project.version}.jar"],
        [name: "qz_uilib_manual_forge112-${project.version}.jar"]
] + ['core', 'font-adapter', 'gl-adapter', 'media-adapter'].collect { [name: 'qz_uilib-' + it + '-java8.jar'] }
ext.uilibInstallDependencies = ['core', 'font-adapter', 'media-adapter', 'gl-renderer', 'lwjgl2', 'gallery', 'verification'].collect { uilibArtifacts[it] }
apply from: '../../gradle/install-manifest.gradle'

// 在独立历史缓冲中验证实际 LWJGL2 事件编码与生产合并消费者。
def inputQueueVerification = tasks.register('compileInputQueueVerification', JavaCompile) {
    source file('../../src/minecraftShared/java/club/heiqi/uilib/host/lwjgl2/Lwjgl2InputQueue.java'),
            file('verification/Lwjgl2InputQueueVerification.java')
    classpath = files(new File(file(project.property('prismRoot')), 'libraries/org/lwjgl/lwjgl/lwjgl/2.9.4-nightly-20150209/lwjgl-2.9.4-nightly-20150209.jar'))
    destinationDir = file('build/verification/input-queue')
    sourceCompatibility = targetCompatibility = '1.8'
    options.encoding = 'UTF-8'
}
tasks.register('verifyInputQueue', JavaExec) {
    dependsOn inputQueueVerification
    def actualClasspath = files(inputQueueVerification.map { it.destinationDir }) + inputQueueVerification.get().classpath
    inputs.files actualClasspath
    doFirst {
        // 以工程目录为基准传入相对 classpath，绕过 Java8 Windows launcher 的中文绝对路径解码问题。
        classpath = files()
        jvmArgs '-cp', actualClasspath.files.collect { artifact ->
            def location = workingDir.toPath()
            def path = artifact.toPath().toAbsolutePath()
            location.root == path.root ? location.relativize(path).toString() : path.toString()
        }.join(File.pathSeparator)
    }
    main = 'club.heiqi.uilib.host.forge112.Lwjgl2InputQueueVerification'
    jvmArgs '-Dfile.encoding=UTF-8'
}
tasks.named('check') { dependsOn 'verifyInputQueue' }

