name: GitHub Release contract

on:
  workflow_call:
    inputs:
      target-tag:
        description: Immutable annotated tag name
        required: true
        type: string
      expected-tag-object:
        description: Expected annotated tag object SHA
        required: true
        type: string
      expected-commit:
        description: Expected peeled commit SHA
        required: true
        type: string
    outputs:
      release_status:
        description: Validated Release state (absent or matching_published)
        value: ${{ jobs.preflight.outputs.release_status }}

jobs:
  gate:
    name: Rebuild and verify immutable release bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: target
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
      TARGET_TAG: ${{ inputs['target-tag'] }}
      EXPECTED_TAG_OBJECT: ${{ inputs['expected-tag-object'] }}
      EXPECTED_COMMIT: ${{ inputs['expected-commit'] }}
      CONTROL_CHECKER: ${{ github.workspace }}/control/scripts/check-github-release.ps1
      TARGET_ROOT: ${{ github.workspace }}/target
      BUNDLE_ROOT: ${{ github.workspace }}/target/build/release-contract/bundle
      BUNDLE_NOTES: ${{ github.workspace }}/target/build/release-contract/bundle/release-notes.md
      BUNDLE_MANIFEST: ${{ github.workspace }}/target/build/release-contract/bundle/manifest.json
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable target tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository }}
          ref: refs/tags/${{ inputs['target-tag'] }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify immutable tag identity
        shell: pwsh
        run: |
          pwsh -NoProfile -File $env:CONTROL_CHECKER -Identity `
            -RepositoryRoot $env:TARGET_ROOT -TargetTag $env:TARGET_TAG `
            -ExpectedTagObject $env:EXPECTED_TAG_OBJECT -ExpectedCommit $env:EXPECTED_COMMIT

      - name: Test and build from target commit
        shell: bash
        run: |
          test -n "${GRADLE_USER_HOME}"
          case "${GRADLE_USER_HOME}" in
            *[!A-Za-z0-9_./-]*) echo "GRADLE_USER_HOME must be an ASCII path" >&2; exit 1 ;;
          esac
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache --no-daemon test build

      - name: Scene boundary gate
        shell: pwsh
        run: pwsh -NoProfile -File "$env:TARGET_ROOT/scripts/check-scene-boundaries.ps1"

      - name: Documentation discipline gate
        shell: pwsh
        run: pwsh -NoProfile -File "$env:TARGET_ROOT/scripts/check-doc-discipline.ps1"

      - name: Stage exact release bundle
        shell: bash
        run: |
          mkdir -p "${BUNDLE_ROOT}"
          cp "${TARGET_ROOT}/build/libs/qz_uilib-${TARGET_TAG}.jar" "${BUNDLE_ROOT}/qz_uilib-${TARGET_TAG}.jar"
          cp "${TARGET_ROOT}/build/libs/qz_uilib-${TARGET_TAG}-dev.jar" "${BUNDLE_ROOT}/qz_uilib-${TARGET_TAG}-dev.jar"
          cp "${TARGET_ROOT}/build/libs/qz_uilib-${TARGET_TAG}-sources.jar" "${BUNDLE_ROOT}/qz_uilib-${TARGET_TAG}-sources.jar"
          cp "${TARGET_ROOT}/build/libs/qz_uilib-${TARGET_TAG}-dev-preshadow.jar" "${BUNDLE_ROOT}/qz_uilib-${TARGET_TAG}-dev-preshadow.jar"
          cp "${TARGET_ROOT}/.changelogs/${TARGET_TAG}.md" "${BUNDLE_NOTES}"

      - name: Verify exact local bundle and write manifest
        shell: pwsh
        run: |
          pwsh -NoProfile -File $env:CONTROL_CHECKER -Local `
            -RepositoryRoot $env:TARGET_ROOT -TargetTag $env:TARGET_TAG `
            -ExpectedTagObject $env:EXPECTED_TAG_OBJECT -ExpectedCommit $env:EXPECTED_COMMIT `
            -AssetRoot $env:BUNDLE_ROOT `
            -NotesPath $env:BUNDLE_NOTES `
            -ManifestPath $env:BUNDLE_MANIFEST

      - name: Upload exact current-run bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qz-github-release-${{ inputs['target-tag'] }}-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            target/build/release-contract/bundle/qz_uilib-${{ inputs['target-tag'] }}.jar
            target/build/release-contract/bundle/qz_uilib-${{ inputs['target-tag'] }}-dev.jar
            target/build/release-contract/bundle/qz_uilib-${{ inputs['target-tag'] }}-sources.jar
            target/build/release-contract/bundle/qz_uilib-${{ inputs['target-tag'] }}-dev-preshadow.jar
            target/build/release-contract/bundle/release-notes.md
            target/build/release-contract/bundle/manifest.json

  preflight:
    name: Verify bundle and any existing Release without writing
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_status: ${{ steps.preflight.outputs.release_status }}
    defaults:
      run:
        working-directory: target
    env:
      TARGET_TAG: ${{ inputs['target-tag'] }}
      EXPECTED_TAG_OBJECT: ${{ inputs['expected-tag-object'] }}
      EXPECTED_COMMIT: ${{ inputs['expected-commit'] }}
      GH_TOKEN: ${{ github.token }}
      CONTROL_CHECKER: ${{ github.workspace }}/control/scripts/check-github-release.ps1
      TARGET_ROOT: ${{ github.workspace }}/target
      BUNDLE_ROOT: ${{ github.workspace }}/target/build/release-contract/bundle
      BUNDLE_NOTES: ${{ github.workspace }}/target/build/release-contract/bundle/release-notes.md
      BUNDLE_MANIFEST: ${{ github.workspace }}/target/build/release-contract/bundle/manifest.json
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable target tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository }}
          ref: refs/tags/${{ inputs['target-tag'] }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Download current-run bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: qz-github-release-${{ inputs['target-tag'] }}-${{ github.run_id }}
          path: target/build/release-contract/bundle

      - name: Reverify current-run bundle
        shell: pwsh
        run: |
          pwsh -NoProfile -File $env:CONTROL_CHECKER -Local `
            -RepositoryRoot $env:TARGET_ROOT -TargetTag $env:TARGET_TAG `
            -ExpectedTagObject $env:EXPECTED_TAG_OBJECT -ExpectedCommit $env:EXPECTED_COMMIT `
            -AssetRoot $env:BUNDLE_ROOT `
            -NotesPath $env:BUNDLE_NOTES `
            -ManifestPath $env:BUNDLE_MANIFEST

      - name: Verify existing Release when present
        id: preflight
        shell: pwsh
        run: |
          pwsh -NoProfile -File $env:CONTROL_CHECKER -Remote `
            -Repository $env:GITHUB_REPOSITORY -TargetTag $env:TARGET_TAG `
            -ExpectedTagObject $env:EXPECTED_TAG_OBJECT -ExpectedCommit $env:EXPECTED_COMMIT `
            -AssetRoot $env:BUNDLE_ROOT `
            -NotesPath $env:BUNDLE_NOTES `
            -ManifestPath $env:BUNDLE_MANIFEST `
            -ExpectedState Preflight -GitHubOutput $env:GITHUB_OUTPUT
