name: GitHub Release publish wrapper

on:
  workflow_call:
    inputs:
      target-tag:
        description: Immutable annotated tag name
        required: true
        type: string
      expected-tag-object:
        description: Expected annotated tag object SHA
        required: true
        type: string
      expected-commit:
        description: Expected peeled commit SHA
        required: true
        type: string
      existing-draft-id:
        description: Fixed existing draft ID supplied only by the audited 4.6.2 recovery caller
        required: false
        type: string
        default: ''

jobs:
  verify:
    name: Run read-only Release contract
    permissions:
      contents: read
    uses: ./.github/workflows/_github-release-contract.yml
    with:
      target-tag: ${{ inputs['target-tag'] }}
      expected-tag-object: ${{ inputs['expected-tag-object'] }}
      expected-commit: ${{ inputs['expected-commit'] }}
      existing-draft-id: ${{ inputs['existing-draft-id'] }}

  publish-release:
    name: Publish one ID-bound Release under strict contract
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: target
    env:
      TARGET_TAG: ${{ inputs['target-tag'] }}
      EXPECTED_TAG_OBJECT: ${{ inputs['expected-tag-object'] }}
      EXPECTED_COMMIT: ${{ inputs['expected-commit'] }}
      RELEASE_STATUS: ${{ needs.verify.outputs.release_status }}
      EXISTING_DRAFT_ID: ${{ inputs['existing-draft-id'] }}
      GH_TOKEN: ${{ github.token }}
      CONTROL_CHECKER: ${{ github.workspace }}/control/scripts/check-github-release.ps1
      CONTROL_PUBLISHER: ${{ github.workspace }}/control/scripts/publish-github-release.ps1
      TARGET_ROOT: ${{ github.workspace }}/target
      BUNDLE_ROOT: ${{ github.workspace }}/target/build/release-contract/bundle
      BUNDLE_NOTES: ${{ github.workspace }}/target/build/release-contract/bundle/release-notes.md
      BUNDLE_MANIFEST: ${{ github.workspace }}/target/build/release-contract/bundle/manifest.json
    steps:
      - name: Checkout release control plane
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout immutable target tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: ${{ github.repository }}
          ref: refs/tags/${{ inputs['target-tag'] }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Download current-run bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: qz-github-release-${{ inputs['target-tag'] }}-${{ github.run_id }}
          path: target/build/release-contract/bundle

      - name: Reverify identity and current-run bundle
        shell: pwsh
        run: |
          pwsh -NoProfile -File $env:CONTROL_CHECKER -Local `
            -RepositoryRoot $env:TARGET_ROOT -TargetTag $env:TARGET_TAG `
            -ExpectedTagObject $env:EXPECTED_TAG_OBJECT -ExpectedCommit $env:EXPECTED_COMMIT `
            -AssetRoot $env:BUNDLE_ROOT `
            -NotesPath $env:BUNDLE_NOTES `
            -ManifestPath $env:BUNDLE_MANIFEST

      - name: Require validated read-contract status
        shell: bash
        run: |
          case "${RELEASE_STATUS}" in
            absent|matching_published) ;;
            *) echo "Unexpected release_status: ${RELEASE_STATUS:-<missing>}" >&2; exit 1 ;;
          esac

      - name: Create exact draft Release and capture ID when absent
        id: create
        if: ${{ needs.verify.outputs.release_status == 'absent' && inputs['existing-draft-id'] == '' }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File $env:CONTROL_PUBLISHER -CreateDraft `
            -Repository $env:GITHUB_REPOSITORY -TargetTag $env:TARGET_TAG `
            -AssetRoot $env:BUNDLE_ROOT -NotesPath $env:BUNDLE_NOTES `
            -GitHubOutput $env:GITHUB_OUTPUT

      - name: Bind one positive Release ID for the write transaction
        id: release
        if: ${{ needs.verify.outputs.release_status == 'absent' }}
        shell: pwsh
        env:
          CREATED_RELEASE_ID: ${{ steps.create.outputs.release_id }}
        run: |
          $ids = @($env:CREATED_RELEASE_ID, $env:EXISTING_DRAFT_ID) |
            Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($ids.Count -ne 1 -or $ids[0] -cnotmatch '^[1-9][0-9]*$') {
            throw '必须且只能绑定一个正整数 Release ID'
          }
          "release_id=$($ids[0])" >> $env:GITHUB_OUTPUT

      - name: Download draft assets by ID and verify
        if: ${{ needs.verify.outputs.release_status == 'absent' }}
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          pwsh -NoProfile -File $env:CONTROL_CHECKER -Remote `
            -Repository $env:GITHUB_REPOSITORY -TargetTag $env:TARGET_TAG `
            -ExpectedTagObject $env:EXPECTED_TAG_OBJECT -ExpectedCommit $env:EXPECTED_COMMIT `
            -AssetRoot $env:BUNDLE_ROOT `
            -NotesPath $env:BUNDLE_NOTES `
            -ManifestPath $env:BUNDLE_MANIFEST -ExpectedState Draft `
            -ReleaseId $env:RELEASE_ID

      - name: Publish verified draft
        if: ${{ needs.verify.outputs.release_status == 'absent' }}
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          pwsh -NoProfile -File $env:CONTROL_PUBLISHER -PublishDraft `
            -Repository $env:GITHUB_REPOSITORY -TargetTag $env:TARGET_TAG `
            -ReleaseId $env:RELEASE_ID

      - name: Final published Release verification
        shell: pwsh
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id || inputs['existing-draft-id'] }}
        run: |
          $arguments = @{
            Repository = $env:GITHUB_REPOSITORY; TargetTag = $env:TARGET_TAG
            ExpectedTagObject = $env:EXPECTED_TAG_OBJECT; ExpectedCommit = $env:EXPECTED_COMMIT
            AssetRoot = $env:BUNDLE_ROOT; NotesPath = $env:BUNDLE_NOTES
            ManifestPath = $env:BUNDLE_MANIFEST; ExpectedState = 'Published'
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RELEASE_ID)) {
            if ($env:RELEASE_ID -cnotmatch '^[1-9][0-9]*$') { throw 'Release ID 输出无效' }
            $arguments.ReleaseId = [long]$env:RELEASE_ID
          }
          & $env:CONTROL_CHECKER -Remote @arguments
