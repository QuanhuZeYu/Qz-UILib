name: Minecraft 发布

# 仅手动触发：接收既存 tag 与确认短语，从该 tag 完整构建后再创建或更新同一 Release。
# tag 由用户创建，工作流不创建、不移动、不重写 tag。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 既存发布 tag（例如 5.0.0-beta3）
        required: true
        type: string
      confirm:
        description: 输入 PUBLISH <tag> 确认发布
        required: true
        type: string
      uilibGroup:
        description: UILib Maven group
        required: false
        type: string
      coreRepository:
        description: Core 仓库 owner/name
        required: false
        default: QuanhuZeYu/Qz-UILib-Core
        type: string
      platformRepository:
        description: Platform 仓库 owner/name
        required: false
        default: QuanhuZeYu/Qz-UILib-Platform
        type: string

permissions:
  contents: read

# 同一 tag 的发布串行执行，不取消进行中的发布。
concurrency:
  group: uilib-minecraft-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
      group: ${{ steps.check.outputs.group }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: 校验 tag、确认短语与静态说明
        id: check
        env:
          CONFIRM: ${{ inputs.confirm }}
          OVERRIDE_GROUP: ${{ inputs.uilibGroup }}
        run: |
          set -euo pipefail
          node .github/scripts/release-inputs.cjs release
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test -f ".changelogs/${RELEASE_TAG}.md" \
            || { echo "缺少静态发布说明" >&2; exit 1; }

  maven:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 下载同 tag Core 与 Platform Maven ZIP
        env:
          UILIB_GROUP: ${{ needs.validate.outputs.group }}
          CORE_REPOSITORY: ${{ inputs.coreRepository }}
          PLATFORM_REPOSITORY: ${{ inputs.platformRepository }}
        run: |
          set -euo pipefail
          core_repo="${CORE_REPOSITORY:-QuanhuZeYu/Qz-UILib-Core}"
          platform_repo="${PLATFORM_REPOSITORY:-QuanhuZeYu/Qz-UILib-Platform}"
          group_path="$(printf '%s' "$UILIB_GROUP" | tr '.' '/')"
          mkdir -p uilib-maven
          fetch() {
            curl -fsSL --retry 3 -o "$3" "https://github.com/$1/releases/download/${RELEASE_TAG}/$2"
          }
          fetch "$core_repo" "qz-uilib-core-${RELEASE_TAG}-maven.zip" core.zip \
            || { echo "缺少 $core_repo 的 ${RELEASE_TAG} Maven ZIP；发布顺序必须为 Core → Platform → Minecraft" >&2; exit 1; }
          fetch "$platform_repo" "qz-uilib-platform-${RELEASE_TAG}-maven.zip" platform.zip \
            || { echo "缺少 $platform_repo 的 ${RELEASE_TAG} Maven ZIP；请先完成 Platform 发布" >&2; exit 1; }
          unzip -q core.zip -d uilib-maven
          unzip -q platform.zip -d uilib-maven
          test -f "uilib-maven/${group_path}/core/${RELEASE_TAG}/core-${RELEASE_TAG}-java8.jar" \
            || { echo "Core ZIP 根不是标准 Maven group 路径" >&2; exit 1; }
          test -f "uilib-maven/${group_path}/font-adapter/${RELEASE_TAG}/font-adapter-${RELEASE_TAG}-java8.jar" \
            || { echo "Platform ZIP 缺少 Java8 字体适配产物" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: uilib-maven
          path: uilib-maven
          if-no-files-found: error
          compression-level: 0

  build:
    needs: [validate, maven]
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: 1.7.10
            directory: .
            java: '25'
            tasks: build manualTestJar releaseAssets installManifest minecraftMavenZip
          - host: forge112
            directory: platforms/forge112
            java: '8'
            tasks: build releaseAssets installManifest
          - host: forge116
            directory: platforms/forge116
            java: '17'
            tasks: build releaseAssets installManifest
          - host: neoforge263
            directory: platforms/neoforge263
            java: '25'
            tasks: build releaseAssets installManifest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: 记录实际构建的 tag commit
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse HEAD)"
          test "$commit" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          # 发布检出既存 tag，只读取普通默认分支 CI 生成的缓存。
          cache-read-only: true
          # action 自带的 matrix 缓存身份区分各 wrapper；保留其分发包以免重复下载。
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper/dists
      - uses: actions/download-artifact@v4
        with:
          name: uilib-maven
          path: uilib-maven
      - name: 从 tag 使用本工程 wrapper 构建
        working-directory: ${{ matrix.directory }}
        shell: bash
        env:
          UILIB_GROUP: ${{ needs.validate.outputs.group }}
          GRADLE_TASKS: ${{ matrix.tasks }}
          UILIB_JDK8: ${{ env.JAVA_HOME_8_X64 }}
        run: |
          set -euo pipefail
          # Java8 原生参数按 UTF-8 解码；Forge 根地址要求可接受的 User-Agent。
          export JAVA_TOOL_OPTIONS="${JAVA_TOOL_OPTIONS--Dsun.jnu.encoding=UTF-8 -Dhttp.agent=Mozilla/5.0}"
          UILIB_REPOSITORY="file:///$(cygpath -m "$GITHUB_WORKSPACE/uilib-maven")"
          bash ./gradlew $GRADLE_TASKS "-PuilibVersion=$RELEASE_TAG" "-PuilibGroup=$UILIB_GROUP" "-PuilibRepository=$UILIB_REPOSITORY" \
            "-PuilibPublicationRepository=file:///$(cygpath -m "$GITHUB_WORKSPACE/build/minecraft-maven")"
      - name: 检查发行资产与安装清单
        working-directory: ${{ matrix.directory }}
        shell: bash
        env:
          UILIB_VERSION: ${{ inputs.tag }}
          UILIB_GROUP: ${{ needs.validate.outputs.group }}
          RELEASE_HOST: ${{ matrix.host }}
        run: |
          set -euo pipefail
          test -s "build/release/qz-uilib-minecraft-${UILIB_VERSION}-${RELEASE_HOST}.zip"
          test -s "build/release/qz-uilib-minecraft-${UILIB_VERSION}-${RELEASE_HOST}-assets.txt"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const manifest = JSON.parse(fs.readFileSync('build/install-manifest.json', 'utf8'));
          if (manifest.schemaVersion !== 1 || manifest.version !== process.env.UILIB_VERSION)
            throw new Error('安装清单版本与本次构建不同');
          if (!manifest.dependencies?.length || manifest.dependencies.some(dependency =>
            dependency.group !== process.env.UILIB_GROUP || dependency.version !== process.env.UILIB_VERSION))
            throw new Error('安装依赖未使用本次精确 Maven 坐标');
          if (!manifest.files?.length) throw new Error('安装清单为空');
          for (const file of [...manifest.files, ...manifest.dependencies]) {
            const sha256 = crypto.createHash('sha256').update(fs.readFileSync(file.source)).digest('hex');
            if (sha256 !== file.sha256) throw new Error('安装清单 SHA256 不符：' + file.source);
          }
          NODE
          ls -l build/release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.host }}
          path: ${{ matrix.directory }}/build/release/*
          if-no-files-found: error
          compression-level: 0
      - name: 上传 Minecraft 开发接口 Maven ZIP
        if: matrix.host == '1.7.10'
        uses: actions/upload-artifact@v4
        with:
          name: release-maven
          path: build/release-maven/qz-uilib-minecraft-${{ inputs.tag }}-maven.zip
          if-no-files-found: error
          compression-level: 0
      - name: 上传构建报告与安装清单
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.host }}
          path: |
            ${{ matrix.directory }}/build/reports/
            ${{ matrix.directory }}/build/test-results/
            ${{ matrix.directory }}/build/install-manifest.json
          if-no-files-found: ignore

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: 读取本次工作流的静态发布说明
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .release-notes
          sparse-checkout: .changelogs
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: 组装发布正文
        env:
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          BUILT_SHA: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILT_SHA"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$BUILT_SHA"
          changelog=".changelogs/${RELEASE_TAG}.md"
          test -f "$changelog" || { echo "缺少 $changelog" >&2; exit 1; }
          test -s "dist/qz-uilib-minecraft-${RELEASE_TAG}-maven.zip"
          for host in 1.7.10 forge112 forge116 neoforge263; do
            test -s "dist/qz-uilib-minecraft-${RELEASE_TAG}-${host}.zip"
            test -s "dist/qz-uilib-minecraft-${RELEASE_TAG}-${host}-assets.txt"
          done
          reviewed_changelog=".release-notes/.changelogs/${RELEASE_TAG}.md"
          test -f "$reviewed_changelog" || { echo "缺少 $reviewed_changelog" >&2; exit 1; }
          cp "$reviewed_changelog" release-body.md
          cat release-body.md
      - name: 创建或更新 Release（精确 404、同名资产 clobber、不删除 Release）
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        run: |
          set -euo pipefail
          set +e
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --include 2>&1)"
          status=$?
          set -e
          if [ $status -ne 0 ]; then
            if printf '%s' "$existing" | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'; then
              gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
                --title "$RELEASE_TAG" --notes-file release-body.md
            else
              printf '%s\n' "$existing" >&2
              echo '查询 Release 失败，未按新建处理' >&2
              exit 1
            fi
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          if [ "$PRERELEASE" = 'true' ]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
              --title "$RELEASE_TAG" --notes-file release-body.md --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false \
              --title "$RELEASE_TAG" --notes-file release-body.md --prerelease=false --latest
          fi
