# 从指定 tag 构建 4 个 jar 并发布到该 tag 对应的 GitHub Release。
# 触发方式（在目标分支上运行）：
#   gh workflow run "Publish Release Assets" --ref <分支> -f tag=4.7.0 -f confirmation="PUBLISH 4.7.0"
#   gh workflow run "Publish Release Assets" --ref <分支> -f tag=4.11.0-beta.1 -f confirmation="PUBLISH 4.11.0-beta.1"
# 若 Release 已存在则把资产上传到既有 Release；不存在则先创建（title 用 tag 名、notes 用 .changelogs/<tag>.md）。
name: Publish Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 目标 release tag，如 4.7.0 或预发布 4.11.0-beta.1
        required: true
        type: string
      confirmation:
        description: 键入 `PUBLISH <tag>` 确认发布资产
        required: true
        type: string

jobs:
  publish:
    name: Build and publish assets for ${{ inputs.tag }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 校验确认短语与 tag 格式
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "${CONFIRMATION}" = "PUBLISH ${TAG}"
          # tag 形态：正式 x.y.z，或预发布 x.y.z-(alpha|beta|rc).N。
          # 后缀只放行 alpha/beta/rc：FML 的 ComparableVersion 把未知限定符（pre/dev/sp 等）
          # 排在正式版之后，那样的 tag 会让 NetworkModHolder 的 acceptVersion(自身) 自检失败。
          # 序号只接受点号形态且必须存在（蓄水池靠 N 递增），历史脏 tag
          # （如 4.5.3-beta-1-fontsort）与无序号形态（4.11.0-beta）一并被拒。
          if [[ ! "${TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "invalid tag format: ${TAG}" >&2
            exit 1
          fi

      - name: Checkout 指定 tag 的不可变代码
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: 校验 tag 解引用提交与 release notes
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          TAG_OBJECT="$(git rev-parse "refs/tags/${TAG}")"
          TAG_COMMIT="$(git rev-parse "refs/tags/${TAG}^{}")"
          test -n "${TAG_OBJECT}"
          test -n "${TAG_COMMIT}"
          test "$(git rev-parse HEAD)" = "${TAG_COMMIT}"
          test -f ".changelogs/${TAG}.md"
          test -s ".changelogs/${TAG}.md"
          echo "TAG_OBJECT=${TAG_OBJECT}" >> "${GITHUB_ENV}"
          echo "TAG_COMMIT=${TAG_COMMIT}" >> "${GITHUB_ENV}"

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '25'

      - name: 测试与构建
        shell: bash
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/qz-gradle-home
        run: |
          test -n "${GRADLE_USER_HOME}"
          chmod +x ./gradlew
          ./gradlew --no-configuration-cache --no-daemon test build

      - name: Stage 资产并生成 manifest
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p build/release-bundle
          cp "build/libs/qz_uilib-${TAG}.jar" build/release-bundle/
          cp "build/libs/qz_uilib-${TAG}-dev.jar" build/release-bundle/
          cp "build/libs/qz_uilib-${TAG}-sources.jar" build/release-bundle/
          cp "build/libs/qz_uilib-${TAG}-dev-preshadow.jar" build/release-bundle/
          cp ".changelogs/${TAG}.md" build/release-bundle/release-notes.md
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile

          tag = os.environ["TAG"]
          tag_object = os.environ["TAG_OBJECT"]
          commit = os.environ["TAG_COMMIT"]
          root = Path("build/release-bundle")
          names = [
              f"qz_uilib-{tag}.jar",
              f"qz_uilib-{tag}-dev.jar",
              f"qz_uilib-{tag}-sources.jar",
              f"qz_uilib-{tag}-dev-preshadow.jar",
          ]
          expected = set(names + ["release-notes.md"])
          actual = {path.name for path in root.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f"unexpected bundle files: {sorted(actual ^ expected)}")

          def describe(path):
              data = path.read_bytes()
              if not data:
                  raise SystemExit(f"empty file: {path.name}")
              return {"name": path.name, "size": len(data), "sha256": hashlib.sha256(data).hexdigest()}

          assets = []
          for name in names:
              path = root / name
              with ZipFile(path) as archive:
                  if archive.testzip() is not None:
                      raise SystemExit(f"unreadable archive member: {name}")
              assets.append(describe(path))
          notes_path = root / "release-notes.md"
          notes_path.read_bytes().decode("utf-8", errors="strict")
          manifest = {
              "schema": "qz-release-manifest/v1",
              "tag": tag,
              "tag_object": tag_object,
              "commit": commit,
              "notes": describe(notes_path),
              "assets": assets,
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: 生成发布说明（changelog 全文 + 验证证据节）
        # 动态证据（run 链接、提交、资产 sha256）由本步骤生成，写进 Release 面；
        # .changelogs/<tag>.md 只承载静态事实，发布前不需要、也不允许回填这些内容。
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          root = Path("build/release-bundle")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          evidence = [
              "",
              "---",
              "",
              "## 验证证据（由发布 workflow 自动生成）",
              "",
              f"- 发布提交：`{manifest['commit']}`（tag `{tag}`，tag 对象 `{manifest['tag_object']}`）",
              f"- 发布 run：{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "- 构建验证：本 workflow 从 `refs/tags/<tag>` 不可变 checkout 后执行 test + build（与分支 CI 同一验证面）",
              "- 资产：",
          ]
          for asset in manifest["assets"]:
              evidence.append(f"  - `{asset['name']}`：{asset['size']} bytes，sha256 `{asset['sha256']}`")
          notes = (root / "release-notes.md").read_text(encoding="utf-8").rstrip() + "\n" + "\n".join(evidence) + "\n"
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          print(f"release notes = changelog + 验证证据（{len(manifest['assets'])} 个资产）")
          PY

      - name: 上传资产到既有 Release 或创建 Release
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          JARS=(
            "build/release-bundle/qz_uilib-${TAG}.jar"
            "build/release-bundle/qz_uilib-${TAG}-dev.jar"
            "build/release-bundle/qz_uilib-${TAG}-sources.jar"
            "build/release-bundle/qz_uilib-${TAG}-dev-preshadow.jar"
          )
          # 预发布 tag 必须标 prerelease：让 GitHub Latest 继续指向最近的正式版，避免 pre 被当成
          # 稳定版取用；正式版不传该标志（与既有发布行为逐位一致，重跑旧 tag 也不会篡改 Latest）。
          if [[ "${TAG}" =~ -(alpha|beta|rc) ]]; then
            RELEASE_KIND=(--prerelease)
          else
            RELEASE_KIND=()
          fi
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${JARS[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${TAG}" "${JARS[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${TAG}" \
              --notes-file release-notes.md \
              "${RELEASE_KIND[@]}"
          fi
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file release-notes.md "${RELEASE_KIND[@]}"

      - name: 校验 Release 资产齐全且已上传
        # Release 资产规范：仅 4 个 jar（manifest.json 只作内部校验物，不发布）。
        # Release title 为纯版本号，notes 为 .changelogs/<tag>.md 全文（含验证边界），draft 恒为 false。
        # prerelease 标记按 tag 形态派生：预发布（-alpha/-beta/-rc）必须为 true，正式版必须为 false。
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets,isPrerelease > release-assets.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          expected = {
              f"qz_uilib-{tag}.jar",
              f"qz_uilib-{tag}-dev.jar",
              f"qz_uilib-{tag}-sources.jar",
              f"qz_uilib-{tag}-dev-preshadow.jar",
          }
          payload = json.loads(Path("release-assets.json").read_text(encoding="utf-8"))
          expected_prerelease = any(marker in tag for marker in ("-alpha", "-beta", "-rc"))
          if bool(payload.get("isPrerelease")) != expected_prerelease:
              raise SystemExit(
                  f"prerelease flag mismatch for {tag}: "
                  f"isPrerelease={payload.get('isPrerelease')}, expected={expected_prerelease}")
          assets = payload["assets"]
          by_name = {asset.get("name"): asset for asset in assets}
          missing = sorted(expected - set(by_name))
          if missing:
              raise SystemExit(f"missing assets: {missing}")
          for name in sorted(expected):
              if by_name[name].get("state") != "uploaded":
                  raise SystemExit(f"asset not uploaded: {name}")
          print(f"verified {len(expected)} assets uploaded for tag {tag}")
          PY
