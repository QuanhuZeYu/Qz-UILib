name: Release tagged build

on:
  push:
    tags: [ '*' ]

permissions:
  contents: read

jobs:
  identity:
    name: Resolve immutable annotated tag identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag_object: ${{ steps.identity.outputs.tag_object }}
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - name: Checkout annotated tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and export tag identity
        id: identity
        shell: bash
        run: |
          test "$(git cat-file -t "${GITHUB_REF}")" = tag
          tag_object="$(git rev-parse "${GITHUB_REF}")"
          commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          test "$(git rev-parse HEAD)" = "${commit}"
          echo "tag_object=${tag_object}" >> "${GITHUB_OUTPUT}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

  release:
    name: Run repository-owned GitHub Release contract
    needs: identity
    permissions:
      contents: write
    uses: ./.github/workflows/_github-release-contract.yml
    with:
      target-tag: ${{ github.ref_name }}
      expected-tag-object: ${{ needs.identity.outputs.tag_object }}
      expected-commit: ${{ needs.identity.outputs.commit }}
      publish: true
