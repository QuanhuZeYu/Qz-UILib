name: Build and test

on:
  pull_request:
    branches: [ 4.0, master, main ]
  push:
    branches: [ '**' ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@8d2e9d2fcfd6ea1c5b8f7c7e15359ad031444c7d

  script-host-policy:
    name: Script host policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false

      - name: Reject disallowed tracked files and workflow hosts
        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          suffix = "." + "p" + "s" + "1"
          forbidden = ("p" + "wsh", "power" + "shell", suffix)
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          bad_files = [path for path in tracked if path.lower().endswith(suffix)]
          bad_workflows = []
          for path in Path(".github/workflows").glob("*"):
              if path.is_file():
                  text = path.read_text(encoding="utf-8").lower()
                  hits = [token for token in forbidden if token in text]
                  if hits:
                      bad_workflows.append((path.as_posix(), hits))
          if bad_files or bad_workflows:
              raise SystemExit(f"disallowed files={bad_files}; workflow tokens={bad_workflows}")
          PY
