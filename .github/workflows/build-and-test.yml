
name: Build and test

on:
  pull_request:
    branches: [ 4.0, master, main ]
  push:
    branches: [ '**' ]

jobs:
  build-and-test:
    uses: GTNewHorizons/GTNH-Actions-Workflows/.github/workflows/build-and-test.yml@master
    secrets: inherit

  publication-gate:
    name: Publication gate
    needs: build-and-test
    runs-on: ubuntu-24.04
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Self-test publication classifier
        shell: pwsh
        run: pwsh scripts/check-publication.ps1 -SelfTest

      - name: Publish and verify normal Gradle metadata
        shell: pwsh
        run: |
          ./gradlew --no-configuration-cache --no-daemon publishToMavenLocal
          pwsh scripts/check-publication.ps1 -Local `
            -RepositoryRoot "$HOME/.m2/repository" `
            -BuildMainJar "build/libs/qz_uilib-4.6.2.jar" `
            -BuildDevJar "build/libs/qz_uilib-4.6.2-dev.jar" `
            -BuildSourcesJar "build/libs/qz_uilib-4.6.2-sources.jar" `
            -GroupId "club.heiqi.uilib" -ArtifactId "Qz-UILib" -Version "4.6.2" `
            -ModuleMetadata RequiredCorrect

      - name: Publish simulated JitPack canonical coordinates
        shell: bash
        env:
          JITPACK: 'true'
          GROUP: com.github.QuanhuZeYu
          ARTIFACT: Qz-UILib
          VERSION: ci-${{ github.sha }}
        run: |
          ARTIFACT_GROUP_ID="$GROUP" ARTIFACT_ID="$ARTIFACT" RELEASE_VERSION="$VERSION" \
            ./gradlew --no-configuration-cache --no-daemon publishToMavenLocal

      - name: Verify simulated JitPack publication
        shell: pwsh
        env:
          CANONICAL_VERSION: ci-${{ github.sha }}
        run: |
          $buildVersionMatches = @(
            Get-Content -LiteralPath "gradle.properties" | ForEach-Object {
              if ($_ -match '^\s*modVersion\s*=\s*(?<value>.*?)\s*$') {
                $Matches['value'].Trim()
              }
            }
          )
          if ($buildVersionMatches.Count -ne 1 -or [string]::IsNullOrWhiteSpace($buildVersionMatches[0])) {
            throw "gradle.properties 必须包含且仅包含一个非空 modVersion"
          }
          $buildVersion = $buildVersionMatches[0]

          pwsh scripts/check-publication.ps1 -Local `
            -RepositoryRoot "$HOME/.m2/repository" `
            -BuildMainJar "build/libs/qz_uilib-$buildVersion.jar" `
            -BuildDevJar "build/libs/qz_uilib-$buildVersion-dev.jar" `
            -BuildSourcesJar "build/libs/qz_uilib-$buildVersion-sources.jar" `
            -GroupId "com.github.QuanhuZeYu" -ArtifactId "Qz-UILib" -Version $env:CANONICAL_VERSION `
            -ModuleMetadata Forbidden -ForbiddenGroupId "club.heiqi.uilib"
