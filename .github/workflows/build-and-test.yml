name: Minecraft 独立构建
on:
  workflow_dispatch:
    inputs:
      uilibRepository:
        description: Core 与 Platform 正式 Maven 仓地址
        required: true
        type: string
      uilibVersion:
        description: UILib 依赖版本
        required: true
        default: 4.11.1
        type: string
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: .
            java: '25'
            tasks: build manualTestJar
          - directory: platforms/forge112
            java: '8'
            tasks: build installBundle
          - directory: platforms/forge116
            java: '17'
            tasks: build installBundle
          - directory: platforms/neoforge263
            java: '25'
            tasks: build installBundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: 使用本工程 wrapper 构建
        working-directory: ${{ matrix.directory }}
        env:
          UILIB_REPOSITORY: ${{ inputs.uilibRepository }}
          UILIB_VERSION: ${{ inputs.uilibVersion }}
        shell: bash
        run: bash ./gradlew ${{ matrix.tasks }} "-PuilibRepository=$UILIB_REPOSITORY" "-PuilibVersion=$UILIB_VERSION"
